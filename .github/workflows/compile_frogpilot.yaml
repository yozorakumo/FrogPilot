name: Compile FrogPilot

on:
  push:
    branches:
      - feat-mazda2-dj-mt-frog
      - test-mazda2-dj-mt-frog
      - dev-mazda2-dj-mt-frog
  workflow_dispatch:
    inputs:
      not_vetted:
        description: "This branch is not vetted"
        type: boolean
        default: false
        required: false
      publish_custom_branch:
        description: "Push to custom branch:"
        type: string
        default: ""
        required: false
      publish_frogpilot:
        description: "Push to FrogPilot"
        type: boolean
        default: false
        required: false
      publish_staging:
        description: "Push to FrogPilot-Staging"
        type: boolean
        default: false
        required: false
      publish_testing:
        description: "Push to FrogPilot-Testing"
        type: boolean
        default: false
        required: false
      runner:
        description: "Select runner"
        type: choice
        options:
          - c3
          - c3x
        default: "c3"
        required: true
      update_translations:
        description: "Update missing/outdated translations"
        type: boolean
        default: false
        required: false
      vet_existing_translations:
        description: "Vet existing translations"
        type: boolean
        default: false
        required: false

env:
  BASE_DIR: ${{ github.workspace }}
  BUILD_DIR: "/data/openpilot"
  CUSTOM_BRANCH: ${{ inputs.publish_custom_branch }}
  GIT_EMAIL: "91348155+FrogAi@users.noreply.github.com"
  GIT_NAME: "James"
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  get_branch:
    runs-on: [self-hosted, "${{ inputs.runner || 'c3' }}"]
    outputs:
      branch: ${{ steps.get_branch.outputs.branch }}
      python_version: ${{ steps.get_python_version.outputs.python_version }}
    steps:
      - name: Clean runner diag files
        run: |
          sudo rm -rf /data/actions-runner/_diag/pages/*.log || true
          sudo rm -rf /data/actions-runner/_diag/*.log || true

      - name: Get Current Branch
        id: get_branch
        run: |
          cd "$BUILD_DIR"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Python Version
        id: get_python_version
        run: |
          echo "python_version=$(tr -d '[:space:]' < "$BUILD_DIR/.python-version")" >> $GITHUB_OUTPUT

  translate:
    needs: get_branch
    if: inputs.update_translations
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Identity
        run: |
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"

      - name: Checkout Required Files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.get_branch.outputs.branch }}
          sparse-checkout: |
            frogpilot/ui/
            selfdrive/controls/lib/alerts_offroad.json
            selfdrive/ui/
            selfdrive/ui/translations/
            selfdrive/ui/translations/auto_translate.py
            selfdrive/ui/update_translations.py

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          cache: "pip"
          python-version: ${{ needs.get_branch.outputs.python_version }}

      - name: Install Dependencies
        run: |
          pip install requests
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qttools5-dev-tools

      - name: Update Translations
        run: |
          python selfdrive/ui/update_translations.py --vanish

      - name: Update Missing Translations
        continue-on-error: true
        timeout-minutes: 300
        run: |
          python selfdrive/ui/translations/auto_translate.py --all-files

      - name: Vet Existing Translations
        if: inputs.vet_existing_translations
        continue-on-error: true
        timeout-minutes: 300
        run: |
          python selfdrive/ui/translations/auto_translate.py --all-files --vet-translations

      - name: Commit and Push Translations
        run: |
          if git diff --quiet selfdrive/ui/translations/*.ts; then
            echo "No translation updates detected."
            exit 0
          fi

          git fetch --unshallow origin "${{ needs.get_branch.outputs.branch }}"
          git checkout "${{ needs.get_branch.outputs.branch }}"
          git add selfdrive/ui/translations/*.ts
          git commit --amend --no-edit
          git push --force origin "${{ needs.get_branch.outputs.branch }}"

  build_and_push:
    needs: [get_branch, translate]
    if: ${{ !failure() && !cancelled() && needs.get_branch.result == 'success' }}
    runs-on: [self-hosted, "${{ inputs.runner || 'c3' }}"]
    env:
      POETRY_CACHE_DIR: /data/poetry_cache
      POETRY_CONFIG_DIR: /data/poetry_config
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      PIP_CACHE_DIR: /data/pip_cache
      TMPDIR: /data/tmp
      VIRTUALENV_OVERRIDE_APP_DATA: /data/virtualenv_app_data
      XDG_CACHE_HOME: /data/xdg_cache
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.BUILD_DIR }}
    steps:
      - name: Clean runner diag files
        run: |
          sudo rm -rf /data/actions-runner/_diag/pages/*.log || true
          sudo rm -rf /data/actions-runner/_diag/*.log || true

      - name: Configure Git
        run: |
          git config http.postBuffer 104857600
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git remote set-url origin "https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/yozorakumo/FrogPilot.git"

      - name: Sync Updates
        run: |
          git fetch origin "${{ needs.get_branch.outputs.branch }}"
          git reset --hard FETCH_HEAD
          git submodule foreach --recursive git reset --hard
          git submodule update --init --recursive

      - name: Cleanup Disk Space
        run: |
          mkdir -p /data/pip_cache
          mkdir -p /data/tmp
          mkdir -p /data/xdg_cache
          rm -rf /home/comma/.cache/pip || true
          echo "=== Disk space before cleanup ==="
          df -h
          
          echo "=== Top 10 largest directories in /data ==="
          sudo du -sh /data/* 2>/dev/null | sort -hr | head -n 10 || true

          # GitHub Actions 共通の不要なツールとパッケージを削除して容量を確保
          echo "Removing unnecessary tools and packages..."
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          # Dockerイメージとキャッシュの削除
          echo "Cleaning up Docker..."
          docker system prune -af || true

          # pyenv経由でインストールされたpoetryを絶対パスで実行
          PYENV_ROOT="/usr/local/pyenv"
          POETRY_BIN=$(find "$PYENV_ROOT/versions" -name "poetry" -type f 2>/dev/null | head -1)
          
          if [ -n "$POETRY_BIN" ]; then
            # poetry のディレクトリを /data に変更して /home の圧迫を避ける
            mkdir -p /data/poetry_cache
            mkdir -p /data/poetry_config
            mkdir -p /data/virtualenv_app_data
            "$POETRY_BIN" config cache-dir /data/poetry_cache
            "$POETRY_BIN" config virtualenvs.in-project true

            echo "Clearing Poetry cache and virtualenvs..."
            "$POETRY_BIN" cache clear pypi --all || true
            "$POETRY_BIN" cache clear _default_cache --all || true
            # 既存の仮想環境も削除してクリーンな状態にする
            rm -rf /home/comma/.cache/pypoetry/virtualenvs/* || true
            rm -rf /home/comma/.config/pypoetry || true
          fi

          echo "Deleting old build artifacts and temporary files..."
          sudo rm -rf /tmp/* || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          
          # /data/openpilot 内の不要なファイルを削除（ビルド成果物など）
          cd /data/openpilot && git clean -fdx || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Pre-build params_pyx.so
        run: |
          cd /data/openpilot
          source .venv/bin/activate
          scons -j$(nproc) --cache-disable common/params_pyx.so
          python3 -c "from openpilot.common.params import Params; print('params_pyx.so OK')"

      - name: Build FrogPilot
        run: |
          # pyenv経由でインストールされたpoetryを絶対パスで実行
          PYENV_ROOT="/usr/local/pyenv"
          
          # poetryの絶対パスを検索
          POETRY_BIN=$(find "$PYENV_ROOT/versions" -name "poetry" -type f 2>/dev/null | head -1)
          if [ -z "$POETRY_BIN" ]; then
            echo "ERROR: poetry not found in $PYENV_ROOT/versions"
            exit 1
          fi
          
          echo "Using poetry: $POETRY_BIN"
          "$POETRY_BIN" install --no-root

          # Ensure submodules are initialized
          echo "Checking for panda/board/SConscript..."
          ls panda/board/ 2>/dev/null || echo "panda/board not found"
          
          echo "Initializing submodules in $BUILD_DIR..."
          git submodule update --init --recursive

          # Ensure we are in the correct directory for scons
          cd "$BUILD_DIR"
          "$POETRY_BIN" run scons -j$(nproc)

      - name: Take Ownership of Build Directory
        run: |
          sudo chown -R $(whoami):$(whoami) .

      - name: Clean Build Artifacts
        run: |
          find . -name "matlab.*.md" -delete

          find . -type d \( -iname "debug" -o -iname "test" -o -iname "tests" -o -name '__pycache__' \) -exec rm -rf {} +

          # 不要なビルド成果物を削除。ただし、実行時に必要な .so や .a、および libyuv などを保持するため慎重に指定
          find . -type f \( \
            -name '*.o' -o \
            -name '*.pyc' -o \
            -name 'moc_*' \
          \) -delete

          find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          find .github/workflows -mindepth 1 ! \( \
            -type f \( \
              -name 'compile_frogpilot.yaml' -o \
              -name 'review_pull_request.yaml' -o \
              -name 'schedule_update.yaml' -o \
              -name 'update_pr_branch.yaml' -o \
              -name 'update_release_branch.yaml' -o \
              -name 'update_tinygrad.yaml' \
            \) \
          \) -exec rm -rf {} +

          # 削除対象をバイナリや不要な一時ファイルに限定し、ソースコードや設定ファイルを保護
          find panda/board -type f ! -path 'panda/board/jungle/*' \
            ! -name 'bootstub.panda.bin' \
            ! -name 'bootstub.panda_h7.bin' \
            ! -name 'panda.bin.signed' \
            ! -name 'panda_h7.bin.signed' \
            ! -name 'SConscript' \
            ! -name '*.c' \
            ! -name '*.h' \
            ! -name '*.s' \
            ! -name '*.ld' \
            ! -name 'README.md' \
            ! -name '__init__.py' \
            -delete

          # 実行に不要なディレクトリやファイルを削除
          rm -rf .vscode/ release/ scripts/ teleoprtc_repo/ .gitattributes .lfsconfig .overlay_init

          find . -type d -empty ! -path "./.git*" -delete

          touch prebuilt
          [ "${{ inputs.not_vetted }}" = "true" ] && touch not_vetted || true

      - name: Add Update Date File
        if: inputs.publish_staging
        continue-on-error: true
        run: |
          curl -fLsS https://raw.githubusercontent.com/FrogAi/FrogPilot/FrogPilot-Staging/.github/update_date -o .github/update_date || echo "No update_date found, skipping..."

      - name: Commit and Push Build
        run: |
          BRANCH="${{ needs.get_branch.outputs.branch }}"
          BUILT_BRANCH="${BRANCH}-built"

          git add -f .
          git diff-index --quiet HEAD || git commit -m "Compile FrogPilot [skip ci]"

          # ビルド成果物を専用ブランチにpush（ソースブランチは変更しない）
          git push --force origin "HEAD:${BUILT_BRANCH}"

          if [ "${{ inputs.publish_frogpilot }}" = "true" ]; then
            git push --force origin HEAD:FrogPilot
          fi

          if [ "${{ inputs.publish_staging }}" = "true" ]; then
            git push --force origin HEAD:FrogPilot-Staging
          fi

          if [ "${{ inputs.publish_testing }}" = "true" ]; then
            git push --force origin HEAD:FrogPilot-Testing
          fi

          if [ -n "$CUSTOM_BRANCH" ]; then
            git push --force origin HEAD:"$CUSTOM_BRANCH"
          fi
